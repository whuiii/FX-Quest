
<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive layout for mobile, tablet, and desktop -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- FX Quest favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Website title -->
    <title>FX Quest — Survive the Global Economy</title>

    <!-- Website description -->
    <meta
      name="description"
      content="FX Quest is a story-driven financial adventure. Explore exchange rates, inflation, interest rates, and global financial decisions through interactive missions."
    />

    <!-- Social media preview -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="FX Quest — Survive the Global Economy"
    />
    <meta
      property="og:description"
      content="Make decisions. Face the economy. Learn the consequences."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Improve Google Fonts loading performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Original FX Quest fonts: Fredoka and Nunito -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Browser theme color -->
    <meta name="theme-color" content="#E8F3FA" />
  </head>

  <body>
    <!-- React application entry point -->
    <div id="root"></div>

    <!-- Vite + React + TypeScript -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
